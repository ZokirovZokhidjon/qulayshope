 <!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qulay Bozor - Director Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --green: #2ecc71; --blue: #3498db; --red: #e74c3c; --dark: #1e2126; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; }
        header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 15px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; border-left: 5px solid var(--green); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .input-panel { background: #fff; padding: 15px; margin: 15px; border-radius: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 150px; }
        .nav-tabs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; }
        .nav-tabs button { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #ddd; white-space: nowrap; }
        .nav-tabs button.active { background: var(--blue); color: white; }
        
        /* Жадвал учун тўғриланган стиль */
        .table-container { background: white; padding: 15px; margin: 15px; border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .btn-act { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; background: var(--red); color: white; }

        @media (max-width: 600px) {
            .input-panel { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div>QULAY BOZOR | <b>ADMIN</b></div>
    <a href="index.html" style="color: gold; text-decoration: none;">ЧИҚИШ</a>
</header>

<div class="stat-grid">
    <div class="stat-card"><h3>ЖАМИ САВДО</h3><p id="stat-sales">0 сум</p></div>
    <div class="stat-card"><h3>МИЖОЗ ҚАРЗИ</h3><p id="stat-client-debts">0 сум</p></div>
    <div class="stat-card"><h3>ДЎКОН ҚАРЗИ</h3><p id="stat-shop-debts">0 сум</p></div>
</div>

<div class="nav-tabs">
    <button id="btn-sales" class="active" onclick="switchTab('sales')">САВДО</button>
    <button id="btn-debts" onclick="switchTab('debts')">ҚАРЗЛАР</button>
    <button id="btn-stock" onclick="switchTab('stock')">ОМБОР</button>
    <button id="btn-expenses" onclick="switchTab('expenses')">ХАРАЖАТЛАР</button>
</div>

<div class="input-panel">
    <input type="text" id="in-name" placeholder="Номи / Исм">
    <input type="text" id="in-desc" placeholder="Изоҳ (mijoz/dukon)">
    <input type="number" id="in-amount" placeholder="Сумма">
    <button onclick="saveData()" style="background:var(--green); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">Сақлаш</button>
</div>

<div class="table-container">
    <table><thead><tr id="t-head"><th>НОМИ</th><th>ИЗОҲ</th><th>СУММА</th><th>АМАЛ</th></tr></thead><tbody id="t-body"></tbody></table>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAt5qPDDjM8o1sFw9zJ2PCA8Md1Su2zybs", databaseURL: "https://qulaybozor-16d03-default-rtdb.firebaseio.com", projectId: "qulaybozor-16d03" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentTab = 'sales';

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        render(); 
    }

    function render() {
        db.ref().off();
        const b = document.getElementById('t-body');
        const h = document.getElementById('t-head');
        b.innerHTML = ""; 

        if (currentTab === 'sales') {
            h.innerHTML = "<th>Вақт</th><th>Кассир</th><th>Смена</th><th>Сумма</th><th>Амал</th>";
            db.ref('sales').on('value', snap => {
                b.innerHTML = "";
                const data = snap.val();
                if (data) Object.entries(data).forEach(([id, v]) => {
                    b.innerHTML += `<tr><td>${v.date || '---'}</td><td>${v.cashier || '---'}</td><td>${v.shift || '---'}</td><td>${Number(v.price || 0).toLocaleString()}</td><td><button class="btn-act" onclick="deleteItem('${id}')">Ўчириш</button></td></tr>`;
                });
            });
        } else if (currentTab === 'debts') {
            h.innerHTML = "<th>Исм</th><th>Тури</th><th>Сумма</th><th>Амал</th>";
            db.ref('debts').on('value', snap => {
                b.innerHTML = "";
                const data = snap.val();
                if (data?.mijoz) Object.entries(data.mijoz).forEach(([id, v]) => b.innerHTML += `<tr><td>${v.name}</td><td>Мижоз</td><td>${Number(v.amount).toLocaleString()}</td><td><button class="btn-act" onclick="deleteItem('${id}', 'mijoz')">Ўчириш</button></td></tr>`);
                if (data?.dukon) Object.entries(data.dukon).forEach(([id, v]) => b.innerHTML += `<tr><td>${v.name}</td><td>Дўкон</td><td>${Number(v.amount).toLocaleString()}</td><td><button class="btn-act" onclick="deleteItem('${id}', 'dukon')">Ўчириш</button></td></tr>`);
            });
        } else if (currentTab === 'stock') {
            h.innerHTML = "<th>Номи</th><th>Миқдори</th><th>Нархи</th><th>Амал</th>";
            db.ref('stock').on('value', snap => {
                b.innerHTML = "";
                const data = snap.val();
                if (data) Object.entries(data).forEach(([id, v]) => {
                    b.innerHTML += `<tr><td>${v.name || '---'}</td><td>${v.qty || '---'}</td><td>${Number(v.price || 0).toLocaleString()}</td><td><button class="btn-act" onclick="deleteItem('${id}')">Ўчириш</button></td></tr>`;
                });
            });
        } else {
            h.innerHTML = "<th>НОМИ</th><th>ИЗОҲ</th><th>СУММА</th><th>АМАЛ</th>";
            db.ref('expenses').on('value', snap => {
                b.innerHTML = "";
                const data = snap.val();
                if (data) Object.entries(data).forEach(([id, x]) => b.innerHTML += `<tr><td>${x.name || '---'}</td><td>${x.desc || '---'}</td><td>${Number(x.amount || 0).toLocaleString()}</td><td><button class="btn-act" onclick="deleteItem('${id}')">Ўчириш</button></td></tr>`);
            });
        }
    }

    function saveData() {
        const name = document.getElementById('in-name').value;
        const desc = document.getElementById('in-desc').value.toLowerCase().trim();
        const amount = Number(document.getElementById('in-amount').value);
        if(!name || !amount) return alert("Маълумотларни тўлдиринг!");
        
        if (currentTab === 'debts') {
            const folder = desc.includes('dukon') ? 'dukon' : 'mijoz';
            db.ref('debts/' + folder).push({ name, amount, date: new Date().toLocaleDateString() });
        } else {
            db.ref(currentTab).push({ name, desc, amount, date: new Date().toLocaleDateString() });
        }
        document.getElementById('in-name').value = "";
        document.getElementById('in-desc').value = "";
        document.getElementById('in-amount').value = "";
    }

    function deleteItem(id, folder = "") { 
        if(confirm("Ўчирасизми?")) {
            const path = folder ? `debts/${folder}/${id}` : `${currentTab}/${id}`;
            db.ref(path).remove();
        }
    }

    function updateStats() {
        db.ref('sales').on('value', s => {
            let total = 0;
            if(s.val()) Object.values(s.val()).forEach(v => total += Number(v.price || v.amount || 0));
            document.getElementById('stat-sales').innerText = total.toLocaleString() + " сум";
        });
        db.ref('debts/mijoz').on('value', s => {
            let total = 0;
            if(s.val()) Object.values(s.val()).forEach(v => total += Number(v.amount || 0));
            document.getElementById('stat-client-debts').innerText = total.toLocaleString() + " сум";
        });
        db.ref('debts/dukon').on('value', s => {
            let total = 0;
            if(s.val()) Object.values(s.val()).forEach(v => total += Number(v.amount || 0));
            document.getElementById('stat-shop-debts').innerText = total.toLocaleString() + " сум";
        });
    }

    render();
    updateStats();
</script>
</body>
</html>
