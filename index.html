<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qulay Bozor - Welcome</title>
    <style>
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        /* Асосий контейнер */
        .hero-container { display: flex; min-height: 100vh; width: 100%; }

        /* Чап томон */
        .left-side { 
            flex: 1; 
            background: url('https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center; 
            background-size: cover;
            position: relative;
            min-height: 300px;
        }
        .orange-badge {
            position: absolute; top: 0; left: 50px;
            background: #f39c12; color: white;
            padding: 30px 20px; width: 180px; text-align: center;
            font-weight: bold; font-size: 22px; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Ўнг томон */
        .right-side { 
            flex: 1.2; 
            background: #27ae60; 
            display: flex; flex-direction: column; 
            justify-content: center; padding: 0 80px; color: white;
            position: relative;
        }

        /* Юқори меню */
        .top-nav {
            padding-top: 30px;
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(255,255,255,0.2); color: white; border: 1px solid white;
            padding: 8px 18px; border-radius: 25px; cursor: pointer;
            text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s;
        }
        .nav-btn:hover { background: white; color: #27ae60; }
        .logo-text { font-size: 18px; font-weight: bold; margin-left: 20px; }

        /* Матнлар */
        .content-area { margin: 50px 0; }
        h1 { font-size: 60px; line-height: 1.1; margin: 0 0 20px 0; text-transform: uppercase; }
        p { font-size: 20px; opacity: 0.9; max-width: 500px; line-height: 1.6; }
        
        /* Footer */
        .footer-line {
            padding: 20px 0; font-size: 20px; font-weight: 300; border-top: 1px solid rgba(255,255,255,0.3);
        }

        /* Мобил вариант учун */
        @media (max-width: 768px) {
            .hero-container { flex-direction: column; }
            .right-side { padding: 20px; }
            .top-nav { justify-content: center; margin-bottom: 20px; }
            h1 { font-size: 35px; }
            .orange-badge { width: 100px; font-size: 12px; left: 10px; padding: 15px 10px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="left-side">
            <div class="orange-badge">
                СИЗНИНГ БАРАКАЛИ ХАРИД БОЗОРИНГИЗ
            </div>
        </div>

        <div class="right-side">
            <div class="top-nav">
                <a href="#" class="nav-btn">ЯНГИ МАҲСУЛОТЛАР</a>
                <a class='nav-btn' href='/'>АСОСИЙ САҲИФА</a>
                <a class='nav-btn' href='/login.html' style='background: #f39c12; border: none;'>ШАХСИЙ КАБИНЕТ</a>
                <span class="logo-text">Qulay market-777 🟢</span>
            </div>
            
            <div class="content-area">
                <h1>ХУШ КЕЛИБСИЗ <br> QULAY MARKET </h1>
                <p>Энг сара маҳсулотлар, сифатли хизмат ва ҳамёнбоп нархлар фақат бизда. Ҳар куни янги ва сархил неъматлар билан сизнинг хизматингиздамиз.</p>
            </div>

            <div class="footer-line">
                Оқилона харид қилинг, соғлом яшанг!
            </div>
        </div>
    </div>

<script src="//taplink.cc/id:14803624/widget/" async></script>
</body>
</html>
