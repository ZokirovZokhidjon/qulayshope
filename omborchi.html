<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Омборчи | Qulay Bozor</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --dark: #121417; --card-bg: #1e2126; --green: #2ecc71; --blue: #3498db; --red: #e74c3c; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .btn-exit { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        .panel { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        input, select { background: #252a31; border: 1px solid #444; color: white; padding: 15px; border-radius: 12px; font-size: 15px; width: 100%; box-sizing: border-box; }
        .btn-add { background: var(--green); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { color: #888; font-weight: 500; text-align: left; padding: 10px; }
        td { background: var(--card-bg); padding: 15px; }
        .btn-icon { border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="color: var(--green);">📦 ОМБОРХОНА</h2>
    <button class="btn-exit" onclick="window.location.href='login.html'">ЧИҚИШ</button>
</div>

<div class="panel">
    <div class="grid">
        <input type="text" id="o-name" placeholder="Товар номи">
        <input type="number" id="o-qty" placeholder="Миқдори">
        <select id="o-unit">
            <option value="дона">Дона</option><option value="кг">Кг</option>
            <option value="гр">Гр</option><option value="метр">Метр</option>
        </select>
        <input type="number" id="o-price" placeholder="Нархи">
    </div>
    <button class="btn-add" onclick="saveToStock()">➕ ТОВАРНИ ҚЎШИШ</button>
</div>

<div class="panel">
    <table>
        <thead><tr><th>Вақт</th><th>Товар</th><th>Миқдор</th><th>Нарх</th><th>Амаллар</th></tr></thead>
        <tbody id="stock-body"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAt5qPDDjM8o1sFw9zJ2PCA8Md1Su2zybs",
        databaseURL: "https://qulaybozor-16d03-default-rtdb.firebaseio.com",
        projectId: "qulaybozor-16d03"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveToStock() {
        const name = document.getElementById('o-name').value;
        const qty = document.getElementById('o-qty').value;
        const unit = document.getElementById('o-unit').value;
        const price = document.getElementById('o-price').value;
        if(!name || !qty || !price) return alert("Барча майдонларни тўлдиринг!");
        db.ref('stock').push({ name, qty: qty + " " + unit, price, date: new Date().toLocaleTimeString() });
        alert("Товар қўшилди!");
        document.getElementById('o-name').value = ""; 
    }

    // ТАҲРИРЛАШ ФУНКЦИЯСИ (Фақат миқдор ва нарх учун)
    function editItem(id, name, qty, price) {
        let parts = qty.split(' ');
        let rawQty = parts[0];
        let rawUnit = parts[1] || 'дона';

        let newQty = prompt("Миқдорни янгилаш (" + rawUnit + "):", rawQty);
        if (newQty === null) return;
        
        let newPrice = prompt("Нархни янгилаш:", price);
        if (newPrice === null) return;

        db.ref('stock/' + id).update({ 
            qty: newQty + " " + rawUnit, 
            price: newPrice 
        });
    }

    function deleteItem(id) {
        if(confirm("Ўчирмоқчимисиз?")) db.ref('stock/' + id).remove();
    }

    db.ref('stock').on('value', snap => {
        const body = document.getElementById('stock-body');
        body.innerHTML = "";
        snap.forEach(s => {
            const v = s.val(), id = s.key;
            body.innerHTML += `<tr>
                <td style="color:#666">${v.date || '--'}</td>
                <td>${v.name}</td>
                <td>${v.qty}</td>
                <td style="color:var(--green)">${Number(v.price).toLocaleString()}</td>
                <td>
                    <button class="btn-icon" style="background:#252a31; color:white" onclick="editItem('${id}', '${v.name}', '${v.qty}', '${v.price}')">✏️</button>
                    <button class="btn-icon" style="background:#4a1e1e; color:white" onclick="deleteItem('${id}')">🗑️</button>
                </td>
            </tr>`;
        });
    });
</script>
</body>
</html>
